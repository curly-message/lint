name: Benchmark

# The benchmark of a PR against its base, posted on the PR and in the job's
# summary, one per workspace, one for the Rust crate, one for the Python
# package, one for the Go module and one for the Composer package. It fails
# where the benchmark does: a row of the branch that fails, or, unless the PR
# carries the `bench-accepted` label, a count that grew, a row gone missing or
# changing kind, or a row that fails on the base. Whether the base has the
# workspace's benchmark is read from the base commit: one without its
# `bench/rows.mjs`, as the base of the PR that adds the workspace or its
# rows, is neither built nor compared, so only the branch's own benchmark can
# fail the job. `bench-label.yml` re-runs it when that label changes.
on:
  pull_request:
    paths:
      - bench/**
      - lint/**
      - eslint-plugin/**
      - rust/**
      - python/**
      - go/**
      - php/**
      - package.json
      - package-lock.json
      - '!**/*.md'
      - '!*/tests/**'
      - .github/workflows/bench.yml

permissions:
  contents: read
  pull-requests: write

# A push supersedes the run of the one before it, so the comment shows the
# head's table.
concurrency:
  group: bench-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  Benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        package: [lint, eslint-plugin, rust, python, go, php]

    steps:
      - name: Checkout the branch
        uses: actions/checkout@v7
        with:
          path: change
          persist-credentials: false

      - name: Checkout the base
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # A workspace's build compiles the core for WebAssembly, on the runner's
      # Rust, so a change to the crate is one to each workspace.
      - name: Setup Rust
        if: matrix.package == 'lint' || matrix.package == 'eslint-plugin'
        run: rustup target add wasm32-unknown-unknown

      # The harness on rows that fail wherever two measurements share a
      # process, so a table below is one whose sides were measured apart, and
      # on each base it may be given: none, one with rows, and a path that
      # holds none, which fails.
      - name: Check the harness
        timeout-minutes: 5
        working-directory: change/bench/check
        run: node check.mjs

      # Read from the base commit rather than off the checkout, so a git that
      # fails, an empty sha included, fails the step instead of reading as a
      # base without rows.
      - name: Read whether the base has the benchmark
        id: base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PACKAGE: ${{ matrix.package }}
        run: |
          rows=$(git -C base ls-tree --name-only "$BASE_SHA" -- "$PACKAGE/bench/rows.mjs")
          if [ -n "$rows" ]; then echo holds=true; else echo holds=false; fi >> "$GITHUB_OUTPUT"

      # Each side from its own lockfile, running no install script, since the
      # job holds a token that writes to the PR. A base without the workspace's
      # benchmark has nothing to compare, so it is not built; one that does not
      # build leaves rows that fail, which the label can accept.
      - name: Install and build
        if: matrix.package == 'lint' || matrix.package == 'eslint-plugin'
        env:
          HOLDS: ${{ steps.base.outputs.holds }}
        run: |
          if [ "$HOLDS" = true ]; then
            (cd base && npm ci --ignore-scripts && npm run build) || echo "::warning::The base did not install or build."
          fi
          (cd change && npm ci --ignore-scripts && npm run build)

      # The Python package builds with the maturin its constraints pin,
      # which uv installs.
      - name: Setup uv
        if: matrix.package == 'python'
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      # The Go module is packed and installed by the oldest Go it states.
      - name: Setup Go
        if: matrix.package == 'go'
        uses: actions/setup-go@v7
        with:
          go-version-file: change/go/go.mod
          cache: false

      # The Composer package is packed and installed by the PHP it names.
      - name: Setup PHP
        if: matrix.package == 'php'
        uses: shivammathur/setup-php@v2
        with:
          php-version-file: change/php/.php-version
          extensions: zip
          coverage: none

      # The crate, the Python package, the Go module and the Composer package
      # by their `bench/prepare.sh`, on the runner's Rust; the base under the
      # same terms.
      - name: Prepare the package
        if: matrix.package == 'rust' || matrix.package == 'python' || matrix.package == 'go' || matrix.package == 'php'
        env:
          HOLDS: ${{ steps.base.outputs.holds }}
          PACKAGE: ${{ matrix.package }}
        run: |
          if [ "$HOLDS" = true ]; then
            (cd "base/$PACKAGE" && sh bench/prepare.sh) || echo "::warning::The base did not build."
          fi
          (cd "change/$PACKAGE" && sh bench/prepare.sh)

      # Read when the job runs rather than off the event, so a re-run sees a
      # label added since.
      - name: Read the labels
        id: labels
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: echo "accepted=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/labels" --jq 'any(.[]; .name == "bench-accepted")')" >> "$GITHUB_OUTPUT"

      - name: Benchmark
        id: bench
        working-directory: change/${{ matrix.package }}
        env:
          ACCEPTED: ${{ steps.labels.outputs.accepted }}
          HOLDS: ${{ steps.base.outputs.holds }}
          PACKAGE: ${{ matrix.package }}
        run: |
          flags=()
          # A workspace the base has no benchmark of is measured alone.
          if [ "$HOLDS" = true ]; then flags+=(--compare "$GITHUB_WORKSPACE/base/$PACKAGE"); fi
          if [ "$ACCEPTED" = true ]; then flags+=(--accepted); fi
          status=0
          node ../bench/harness.mjs "${flags[@]}" > "$RUNNER_TEMP/bench.md" || status=$?
          cat "$RUNNER_TEMP/bench.md" >> "$GITHUB_STEP_SUMMARY"
          echo "status=$status" >> "$GITHUB_OUTPUT"

      # One comment per workspace, the bot's own, edited by each run. A PR from
      # a fork gets a token that cannot comment; its table is in the job's
      # summary.
      - name: Comment on the PR
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PACKAGE: ${{ matrix.package }}
        run: |
          marker="<!-- bench:$PACKAGE -->"
          body="$marker"$'\n'"$(cat "$RUNNER_TEMP/bench.md")"$'\n\n'"Measured on $HEAD."
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n 1)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" > /dev/null
          fi

      - name: Fail where the benchmark failed
        if: steps.bench.outputs.status != '0'
        run: exit 1
