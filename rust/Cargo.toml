[package]
name = "curly-message-lint"
version = "1.0.0-next.0"
edition = "2024"
rust-version = "1.88"
description = "A linter for the Curly Message Format: the rules, a catalogue reader and the curly-lint command."
license = "MIT AND Unicode-3.0"
repository = "https://github.com/curly-message/lint"
homepage = "https://curlymessage.dev/"
readme = "README.md"
keywords = ["curly-message", "i18n", "lint", "translation", "catalogue"]
categories = ["internationalization", "localization", "command-line-utilities"]
include = ["src/**", "cldr/**", "README.md", "CHANGELOG.md", "LICENSE", "Cargo.toml"]

[features]
default = ["cldr"]
# The plural rules of the Unicode CLDR, built in: what the command reads a
# locale's categories from, and a library may hand its own in place of.
cldr = []

[dependencies]
curly-message-parser = "1.0.0-next.0"
unicode-properties = { version = "0.1.4", default-features = false, features = ["general-category"] }

[dev-dependencies]
serde_json = { version = "1.0.140", features = ["float_roundtrip"] }
sha2 = "0.10.8"
libtest-mimic = "0.8.2"

[[test]]
name = "fixtures"
path = "tests/fixtures/main.rs"
harness = false

[[bin]]
name = "curly-lint"
path = "src/bin/curly-lint/main.rs"
required-features = ["cldr"]

[lints]
workspace = true

[workspace]
members = [".", "bench"]
resolver = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
string_slice = "deny"
arithmetic_side_effects = "deny"
non_ascii_literal = "deny"
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
